<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lesebok: to papirkort på en valnøttbrun pult, med et stort anførselstegn -->
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .2  0 0 0 .08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#2a1f18"/>
  <!-- kortet bak -->
  <g transform="rotate(-7 256 270)" filter="url(#soft)">
    <rect x="118" y="112" width="276" height="316" rx="26" fill="#d9c4a3"/>
  </g>
  <!-- kortet foran -->
  <g transform="rotate(3 256 256)" filter="url(#soft)">
    <rect x="118" y="98" width="276" height="316" rx="26" fill="#f3e7d3"/>
    <rect x="118" y="98" width="276" height="316" rx="26" fill="#f3e7d3" filter="url(#grain)"/>
    <text x="142" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="260" fill="#c06a3e">“</text>
    <rect x="152" y="278" width="200" height="13" rx="6.5" fill="#7a5e48" opacity=".8"/>
    <rect x="152" y="308" width="172" height="13" rx="6.5" fill="#7a5e48" opacity=".8"/>
    <rect x="152" y="338" width="112" height="13" rx="6.5" fill="#7a5e48" opacity=".5"/>
  </g>
</svg>
